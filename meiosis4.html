<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>감수분열 염색체 이동 시뮬레이터</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100%;
      color: #25332e;
      font-family: "Noto Sans KR", sans-serif;
    }
    button { font-family: inherit; }
    button:focus-visible, .chromosome-choice:focus-visible, .spindle-handle:focus-visible {
      outline: 3px solid #74b99a;
      outline-offset: 3px;
    }
    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      padding: 18px 16px 32px;
    }
    .app-content { width: 100%; max-width: 1420px; margin: 0 auto; }
    .layout-grid {
      display: grid;
      grid-template-columns: 190px minmax(550px, 1fr) 220px;
      gap: 14px;
      margin-top: 14px;
    }
    .card-base {
      border: 1px solid #dbe3df;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 18px #0000000d;
    }
    .progress-track { height: 8px; overflow: hidden; border-radius: 999px; background: #e9efec; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: #3b956d; transition: width .35s ease; }
    .step-row {
      padding: 8px 9px; border-radius: 9px; background: #f6f8f7; color: #7b8581;
      font-size: 11px; line-height: 1.25;
    }
    .step-row.active { background: #e8f5ef; color: #26734f; font-weight: 800; }
    .step-row.done { color: #397e61; }
    .scene-box {
      position: relative; margin-top: 12px; overflow: hidden; border: 1px solid #dce4e0;
      border-radius: 14px; background: #fbfcfb;
    }
    #stageSvg { display: block; width: 100%; min-height: 360px; touch-action: none; }
    .chromosome-choice {
      display: flex; width: 118px; min-height: 93px; flex-direction: column; align-items: center;
      justify-content: center; border: 1px solid #d7e1dc; border-radius: 12px; background: #fff;
      box-shadow: 0 2px 7px #0000000a; cursor: grab; transition: .15s ease; touch-action: none;
    }
    .chromosome-choice:hover { border-color: #378d68; background: #f2fbf6; transform: translateY(-2px); }
    .chromosome-choice:active { cursor: grabbing; }
    .chromosome-choice svg { width: 78px; height: 57px; pointer-events: none; }
    .chromosome-choice span { margin-top: 2px; color: #58655f; font-size: 10px; font-weight: 800; pointer-events: none; }
    .bank-choice-group { display:flex; flex-direction:column; align-items:center; gap:5px; }
    .flip-bank-button { border:1px solid #c8d9d0; border-radius:8px; background:#edf6f1; color:#357457; padding:5px 9px; font-size:10px; font-weight:800; cursor:pointer; }
    .flip-bank-button:hover { background:#dff0e8; border-color:#75a98f; }
    /* 보관함 영역 높이 고정: 염색체 버튼이 없는 단계(간기·후기 I·후기 II)에서도
       .chromosome-choice 한 개 분량의 높이를 유지해 하단 버튼 위치가 흔들리지 않게 함 */
    #bankItems {
      min-height: 93px;
      align-content: center;
      align-items: center;
    }
    .feedback { min-height: 24px; margin-top: 9px; font-size: 12px; font-weight: 800; }
    .ok { color: #2c8b61; } .bad { color: #b04b47; }
    .placed { cursor: grab; pointer-events: all; } .placed:active { cursor: grabbing; }
    .spindle-short { stroke: #9fc4af; stroke-width: 3; stroke-linecap: round; }
    .spindle-line { stroke: #79ad92; stroke-width: 4; stroke-linecap: round; }
    .spindle-line.attached { stroke: #3a956d; stroke-width: 4.5; }
    .spindle-handle { cursor: grab; pointer-events: all; filter: drop-shadow(0 2px 2px #31574433); }
    .spindle-handle:active { cursor: grabbing; }
    .centromere-target { animation: centromerePulse 1.25s ease-in-out infinite; }
    @keyframes centromerePulse { 0%,100% { stroke-width: 4; } 50% { stroke-width: 7; } }
    .separate-left { animation: leftSeparate 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    .separate-right { animation: rightSeparate 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    .final-left { transform: translateX(-62px); }
    .final-right { transform: translateX(62px); }
    .contract-left { animation: contractLeft 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    .contract-right { animation: contractRight 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    @keyframes leftSeparate { from { transform: translateX(0); } to { transform: translateX(-62px); } }
    @keyframes rightSeparate { from { transform: translateX(0); } to { transform: translateX(62px); } }
    @keyframes contractLeft { to { transform: scaleX(.54); } }
    @keyframes contractRight { to { transform: scaleX(.54); } }
    .contract-left { transform-box: fill-box; transform-origin: left center; }
    .contract-right { transform-box: fill-box; transform-origin: right center; }
    .chromatid-moving-left { animation: pullLeft 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    .chromatid-moving-right { animation: pullRight 1.25s cubic-bezier(.22,.8,.28,1) forwards; }
    .chromatid-final-left { transform: translateX(-58px); }
    .chromatid-final-right { transform: translateX(58px); }
    @keyframes pullLeft { to { transform: translateX(-58px); } }
    @keyframes pullRight { to { transform: translateX(58px); } }
    .history-item {
      width: 100%; cursor: pointer; border: 1px solid #dce4e0; border-radius: 9px; padding: 8px;
      background: #fafcfa; text-align: left; transition: .15s ease;
    }
    .history-item:hover { border-color: #6c9b82; box-shadow: 0 3px 10px #00000012; }
    .history-dot {
      display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center;
      border: 1px solid #cfe3d7; border-radius: 50%; background: #edf7f1; color: #31815e;
      font-size: 12px; font-weight: 900;
    }
    .modal { display: none; position: fixed; inset: 0; z-index: 50; }
    .modal.show { display: block; }
    .modal-backdrop { position: absolute; inset: 0; background: #10201899; backdrop-filter: blur(2px); }
    .modal-box {
      position: absolute; top: 50%; left: 50%; width: min(760px, 92vw); max-height: 88%;
      overflow: auto; transform: translate(-50%, -50%); border-radius: 18px; background: #fff;
      padding: 18px; box-shadow: 0 18px 60px #0005;
    }
    /* 드래그 잔상(고스트): 박스 없이 염색체 실루엣만 커서를 따라 이동하며,
       유효/무효 위치에 따라 실루엣을 감싸는 얇은 외곽선 색이 바뀜.
       크기는 JS(createDragGhost)에서 스테이지 배율에 맞춰 인라인으로 지정합니다. */
    .drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .drag-ghost svg {
      display: block;
      opacity: .96;
      filter: url(#ghostOutlineNeutral);
      transition: filter .12s ease;
    }
    .drag-ghost.drag-ghost--valid svg { filter: url(#ghostOutlineValid); }
    .drag-ghost.drag-ghost--invalid svg { filter: url(#ghostOutlineInvalid); }
    @media (max-width: 1050px) { .layout-grid { grid-template-columns: 1fr; } .side-panel { display: none; } }
    @media (max-width: 620px) {
      .app-shell { padding: 10px; } .header-inner { padding: 18px !important; }
      .control-row { flex-direction: column; } #stageSvg { min-height: 285px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
 </head>
 <body data-template-id="__page-root">
  <!-- 드래그 고스트에 사용할 SVG 외곽선 필터 정의 (화면에는 보이지 않음) -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
    <defs>
      <filter id="ghostOutlineNeutral" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="thicken"/>
        <feFlood flood-color="#8fa79b" result="color"/>
        <feComposite in="color" in2="thicken" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="ghostOutlineValid" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="thicken"/>
        <feFlood flood-color="#2c8b61" result="color"/>
        <feComposite in="color" in2="thicken" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="ghostOutlineInvalid" x="-50%" y="-50%" width="200%" height="200%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.4" result="thicken"/>
        <feFlood flood-color="#c0433d" result="color"/>
        <feComposite in="color" in2="thicken" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>
  <div class="app-shell">
   <div class="app-content">
    <header data-template-id="header-panel" class="canva-header header-inner rounded-[18px] bg-white p-[22px] text-center shadow-sm">
     <h1 data-template-id="page-title" class="canva-text font-black">감수분열 염색체 이동 시뮬레이터</h1>
     <p data-template-id="page-subtitle" class="canva-text mt-2">2n=4인 세포의 두 쌍의 상동염색체를 직접 배치하며 감수분열 과정을 학습해 보세요.</p>
    </header>
    <div class="layout-grid">
     <aside data-template-id="progress-card" class="canva-sidebar side-panel card-base bg-white">
      <h2 data-template-id="progress-heading" class="canva-text mb-2 font-black">진행 단계</h2>
      <div class="mb-1 flex justify-between text-[10px] font-extrabold"><span id="stepText">1 / 10</span><span id="percent">0%</span>
      </div>
      <div class="progress-track">
       <div id="progress" class="progress-bar"></div>
      </div>
      <div id="stepList" class="mt-3 grid gap-[6px]"></div>
      <hr class="my-4 border-0 border-t border-[#e4eae7]">
      <p data-template-id="progress-helper" class="canva-text text-[11px] leading-relaxed">각 단계를 완료하면 자동으로 기록됩니다.</p>
     </aside>
     <main data-template-id="main-panel" class="canva-panel card-base bg-white">
      <div class="flex items-start justify-between gap-4">
       <div>
        <h2 id="stageTitle" class="text-[22px] font-black text-[#253d68]"></h2>
        <p id="stageSub" class="mt-1 text-[12px] text-[#78837e]"></p>
       </div><span id="badge" class="rounded-full bg-[#eef4ff] px-3 py-1.5 text-[11px] font-extrabold text-[#37649a]"></span>
      </div>
      <div data-template-id="instruction-panel" class="canva-banner mt-3 rounded-xl border border-[#e1e8e4] bg-[#f8faf9] px-3 py-2.5 text-[13px] leading-relaxed"><span id="instruction"></span>
      </div>
      <div id="scene" class="scene-box" aria-label="염색체 조작 영역"></div>
      <section data-template-id="bank-panel" class="canva-panel mt-3 rounded-[13px] border border-dashed border-[#bccdc6] bg-[#f8fafb] p-3 text-center">
       <h3 data-template-id="bank-heading" class="canva-text mb-2 font-black">보관함</h3>
       <div id="bankItems" class="flex flex-wrap justify-center gap-3"></div>
       <p id="bankHint" class="mt-2 text-[11px] text-[#73817a]"></p>
      </section>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <div class="control-row mt-2 flex justify-between gap-3">
       <div class="flex gap-2"><button data-template-id="previous-button" id="prev" type="button" class="canva-button rounded-[10px] bg-[#e8eef5] px-3 py-2 text-[12px] font-black text-[#355a7d]">← 이전 단계</button> <button data-template-id="reset-button" id="reset" type="button" class="canva-button rounded-[10px] bg-[#edf1ef] px-3 py-2 text-[12px] font-black text-[#48564f]">현재 단계 다시하기</button>
       </div><button data-template-id="next-button" id="next" type="button" class="canva-button rounded-[10px] bg-[#328b64] px-4 py-2 text-[12px] font-black text-white disabled:cursor-not-allowed disabled:opacity-40">다음 단계 →</button>
      </div>
     </main>
     <aside data-template-id="history-panel" class="canva-sidebar side-panel card-base bg-white">
      <h2 data-template-id="history-heading" class="canva-text mb-2 font-black">완료한 단계</h2>
      <div id="history" class="grid max-h-[720px] gap-2 overflow-auto"></div>
     </aside>
    </div>
    <section data-template-id="final-panel" id="final" class="canva-section mt-[14px] hidden rounded-2xl border border-[#dbe3df] bg-white p-4">
     <h2 data-template-id="final-heading" class="canva-text mb-1 font-black">모든 단계를 완료했습니다</h2>
     <p data-template-id="final-description" class="canva-text mb-3 text-[12px]">아래에서 각 단계별로 완성한 결과를 다시 확인할 수 있습니다.</p>
     <div id="finalGrid" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div><div class="mt-4 flex flex-wrap gap-2"><button data-template-id="save-final-button" id="saveFinalResult" type="button" class="canva-button rounded-[10px] bg-[#328b64] px-4 py-2 text-[12px] font-black text-white">전체 과정 이미지로 저장</button><button data-template-id="restart-button" id="restart" type="button" class="canva-button rounded-[10px] bg-[#edf1ef] px-4 py-2 text-[12px] font-black text-[#48564f]">처음부터 다시하기</button></div>
    </section>
   </div>
  </div>
  <div id="historyModal" class="modal" aria-hidden="true">
   <div id="modalBackdrop" class="modal-backdrop"></div>
   <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="modalClose" type="button" class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-full bg-[#eef2ef] text-xl text-[#46544d]" aria-label="닫기">×</button>
    <h2 id="modalTitle" class="pr-10 text-xl font-black text-[#254d82]"></h2>
    <p id="modalSub" class="mb-3 mt-1 text-[12px] text-[#78837e]"></p>
    <div id="modalScene" class="rounded-xl border border-[#dbe4df] bg-[#fbfcfb] p-2"></div>
   </div>
  </div>
  <script>
    const stages = [
      ["간기", "제1분열", "DNA가 복제되어 양이 2배로 늘어나지만 염색체가 뚜렷하게 보이지 않는다.", "interphase", 0],
      ["전기 I", "제1분열", "핵막이 사라지고, 상동염색체가 결합하여 2가 염색체가 나타난다.", "prophase", 2],
      ["중기 I", "제1분열", "결합한 상동 염색체가 세포 가운데(적도판)에 배열한다.", "meta1", 2],
      ["후기 I", "제1분열", "상동염색체가 분리되고, 각 염색체가 세포 양쪽 끝으로 이동한다.", "ana1", 0],
      ["말기 I", "제1분열", "핵막이 나타나고 세포질 분열이 일어나 2개의 딸세포가 형성된다.", "telo1", 2],
      ["전기 II", "제2분열", "각 세포에 2개의 염색 분체로 이루어진 염색체가 존재하고, 핵막이 사라진다.", "prophase2", 4],
      ["중기 II", "제2분열", "염색체가 세포 가운데(적도판)에 배열한다.", "meta2", 4],
      ["후기 II", "제2분열", "각 염색체의 염색 분체가 분리되어 세포 양쪽 끝으로 이동한다.", "ana2", 0],
      ["말기 II", "제2분열", "핵막이 나타나고 세포질 분열이 일어나 딸세포 네 개가 만들어 진다.", "telo2", 4],
      ["생식세포 형성", "제2분열", "딸세포는 생식세포(정자, 난자)가 된다.", "gamete", 8]    ];

    const $ = id => document.getElementById(id);

    // 후기 II ~ 말기 II 관련 이동/인식 거리 상수
    // ANA2_OFFSET: 염색분체가 세포 중심에서 최종적으로 벌어지는 거리(과거 62px → 58px로 축소)
    // ANA2_FIBER_OFFSET: 후기 II 방추사가 도달하는 거리(과거 78px → 74px로 축소)
    // 두 값을 함께 줄여, 커진 핵막(반지름 54)이 세포질 경계 밖으로 나가지 않도록 여유를 확보합니다.
    const ANA2_OFFSET = 58;
    const ANA2_FIBER_OFFSET = 74;
    // 핵막을 유효하게 씌운 것으로 인식하는 반경(사전 스냅 없이, 드롭 지점이 이 반경 안이면 유효 처리)
    const MEMBRANE_CAPTURE_RADIUS = 50;

    let stage = 0;
    let placements = [];
    let meta1Placements = [];
    let meta2Placements = [];
    let history = [];
    let activeDrag = null;
    let spindleState = { ana1Left: false, ana1Right: false, leftCellLeft: false, leftCellRight: false, rightCellLeft: false, rightCellRight: false };
    let animatedCells = { ana1: false, leftCell: false, rightCell: false };

    function cell(x, y, radius, indented = false) {
      if (!indented) return `<circle cx="${x}" cy="${y}" r="${radius}" fill="#fff9d8" stroke="#c9bd75" stroke-width="3"/>`;
      return `<path d="
    M ${x} ${y-radius*.72}
    C ${x+radius*.62} ${y-radius*.86} ${x+radius} ${y-radius*.58} ${x+radius} ${y}
    C ${x+radius} ${y+radius*.58} ${x+radius*.62} ${y+radius*.86} ${x} ${y+radius*.72}
    C ${x-radius*.62} ${y+radius*.86} ${x-radius} ${y+radius*.58} ${x-radius} ${y}
    C ${x-radius} ${y-radius*.58} ${x-radius*.62} ${y-radius*.86} ${x} ${y-radius*.72}
    Z"
    fill="#fff9d8" stroke="#c9bd75" stroke-width="3"/>`;
}

        function chromosome(type) {
      const blue = "#2e82bd", orange = "#e56b32";
      if (type === "pair") {
        return `<g fill="none" stroke-linecap="round">
          <g stroke="${blue}" stroke-width="7"><path d="M-55 -33 L-7 0 L-55 33"/><path d="M-41 -33 L6 0 L-41 33"/></g>
          <g stroke="${orange}" stroke-width="7"><path d="M55 -33 L7 0 L55 33"/><path d="M41 -33 L-6 0 L41 33"/></g>
        </g>`;
      }
      if (type === "smallPair") {
        return `<g fill="none" stroke-linecap="round">
          <g stroke="${blue}" stroke-width="6"><path d="M-39 -24 L-5 0 L-39 24"/><path d="M-29 -24 L4 0 L-29 24"/></g>
          <g stroke="${orange}" stroke-width="6"><path d="M39 -24 L5 0 L39 24"/><path d="M29 -24 L-4 0 L29 24"/></g>
        </g>`;
      }
      if (type === "blue" || type === "orange") {
        const color = type === "blue" ? blue : orange;
        return `<g fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"><path d="M-27 -35 L27 35 M27 -35 L-27 35"/><circle cx="0" cy="0" r="5" fill="#fff" stroke="${color}" stroke-width="2"/></g>`;
      }
      if (type === "smallBlue" || type === "smallOrange") {
        const color = type === "smallBlue" ? blue : orange;
        return `<g fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"><path d="M-19 -25 L19 25 M19 -25 L-19 25"/><circle cx="0" cy="0" r="4" fill="#fff" stroke="${color}" stroke-width="2"/></g>`;
      }
      if (type === "membrane") {
        return `<circle cx="0" cy="0" r="54" fill="#f5e4d6" fill-opacity="0.10" stroke="#d2ad8e" stroke-width="4" stroke-dasharray="7 6"/>`;
      }
      const color = type === "singleBlue" || type === "singleSmallBlue" ? blue : orange;
      const small = type === "singleSmallBlue" || type === "singleSmallOrange";
      return `<path d="M0 ${small ? -25 : -34} C${small ? -3 : -4} ${small ? -12 : -16} ${small ? 3 : 4} ${small ? 12 : 16} 0 ${small ? 25 : 34}" fill="none" stroke="${color}" stroke-width="${small ? 6 : 8}" stroke-linecap="round"/>`;
    }
    function mini(type) {
      // 핵막은 반지름이 커져 기존 viewBox(-75 -50 150 100)에서 위아래가 살짝 잘리므로
      // 보관함 아이콘용 viewBox를 별도로 넓혀 잘리지 않게 합니다.

        if (prompts.some(prompt => content.includes(prompt)) ||
            (stage === 2 && (content === "적도판" || content.includes("좌우 반전"))) ||
            [3, 4, 7, 8, 9].includes(stage)) label.remove();
      });
      copy.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const source = new XMLSerializer().serializeToString(copy);
      return URL.createObjectURL(new Blob([source], {type:"image/svg+xml;charset=utf-8"}));
    }

    function snapshot() {
      const description = stages[stage][2];

      history[stage] = {
        title:stages[stage][0], phase:stages[stage][1], number:stage+1,
        imageUrl:captureCurrentScene(),
        description
      };
      renderHistory();
    }

    function renderHistory() {
      const done = history.filter(Boolean);
      $("history").innerHTML = done.length ? done.map(item => `<button type="button" class="history-item" data-history="${item.number-1}"><div class="flex items-center gap-2"><div class="history-dot">${item.number}</div><div><div class="text-[11px] font-black text-[#2b473b]">${item.title}</div><div class="mt-0.5 text-[10px] text-[#77827d]">${item.phase} · 크게 보기</div></div></div>${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.title} 단계에서 저장된 염색체 배치" class="mt-2 w-full rounded-lg border border-[#dce4e0] bg-[#fbfcfb]">` : ""}</button>`).join("") : `<p class="text-[11px] text-[#7b8581]">아직 완성한 단계가 없습니다.</p>`;
      document.querySelectorAll("[data-history]").forEach(button => button.addEventListener("click",() => openHistory(Number(button.dataset.history))));
    }

    function openHistory(index) {
      const item = history[index]; if (!item) return;
      $("modalTitle").textContent = `${item.number}단계 · ${item.title}`;
      $("modalSub").textContent = `${item.phase} · ${item.description}`;
      $("modalScene").innerHTML = item.imageUrl
        ? `<img src="${item.imageUrl}" alt="${item.title} 단계에서 저장된 염색체 배치" class="block w-full rounded-lg border border-[#dbe4df] bg-[#fbfcfb]">`
        : `<p class="p-6 text-center text-[12px] text-[#78837e]">저장된 이미지가 없습니다.</p>`;
      $("historyModal").classList.add("show"); $("historyModal").setAttribute("aria-hidden","false");
    }

    function closeHistory() {
      $("historyModal").classList.remove("show"); $("historyModal").setAttribute("aria-hidden","true"); $("modalScene").innerHTML = "";
    }

    $("next").addEventListener("click",() => {
      if (!stageComplete()) return;
      if (stage === 2) meta1Placements = placements.map(item => ({...item}));
      if (stage === 6) meta2Placements = placements.map(item => ({...item}));
      snapshot();

      if (stage < stages.length-1) {
        stage++;
        if (stage === 2) bankFlipState = { pair:false, smallPair:false };
        if (stage === 3) placements = meta1Placements.map(item => ({...item}));
        else if (stage === 7) placements = meta2Placements.map(item => ({...item}));
        else placements = [];
        resetSpindles();
        feedback("",true);
        render();
        return;
      }
      $("progress").style.width = "100%"; $("percent").textContent = "100%";
      $("final").classList.remove("hidden");
      $("finalGrid").innerHTML = history.filter(Boolean).map(item => `<article class="rounded-xl border border-[#dce4e0] bg-[#fbfcfb] p-3"><div class="flex items-center gap-2"><div class="history-dot">${item.number}</div><div><h3 class="text-[13px] font-black text-[#2b473b]">${item.title}</h3><p class="mt-1 text-[11px] text-[#74807b]">${item.description}</p></div></div>${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.title} 단계에서 저장된 염색체 배치" class="mt-3 w-full rounded-lg border border-[#dce4e0] bg-white">` : ""}</article>`).join("");
      $("final").scrollIntoView({behavior:"smooth"});
    });

    $("prev").addEventListener("click",() => {
      if (stage===0) return;
      stage--;
      placements = (stage===2 || stage===3) ? meta1Placements.map(item=>({...item})) : (stage===6 || stage===7) ? meta2Placements.map(item=>({...item})) : [];
      resetSpindles(); feedback("",true); render();
    });

    $("reset").addEventListener("click",() => {
      if (stage===3) { resetSpindles(); placements = meta1Placements.map(item=>({...item})); }
      else if (stage===7) { resetSpindles(); placements = meta2Placements.map(item=>({...item})); }
      else placements = [];
      render();
      feedback((stage===3 || stage===7) ? "방추사 연결 상태를 초기화했습니다." : "현재 단계의 배치를 초기화했습니다.",true);
    });

    // 최종 요약 자료에만 쓰이는 설명. 따옴표로 감싼 용어는 굵게 그립니다.
    const finalSummaries = [
      "'DNA가 복제'되어 '양이 2배'로 늘어나지만\n염색체가 뚜렷하게 보이지 않는다.",
      "핵막이 사라지고, '상동 염색체'가 결합하여 '2가 염색체'가 나타난다.",
      "결합한 '상동 염색체'가 세포 가운데(적도판)에 배열한다.",
      "'상동염색체'가 분리되고, 각 '염색체'가 세포 양쪽 끝으로 이동한다.",
      "'핵막'이 나타나고 '세포질 분열'이 일어나 2개의 딸세포가 형성된다.",
      "각 세포에 '2개의 염색 분체'로 이루어진 '염색체'가 존재하고,\n핵막이 사라진다.",
      "'염색체'가 세포 가운데(적도판)에 배열한다.",
      "각 '염색체'의 '염색 분체'가 분리되어 세포 양쪽 끝으로 이동한다.",
      "'핵막'이 나타나고 '세포질 분열'이 일어나 딸세포 네 개가 만들어 진다.",
      "딸세포는 '생식세포(정자, 난자)'가 된다."
    ];

    // 원문의 공백만 유지합니다. 강조 표현 앞뒤에 임의의 공백을 추가하지 않습니다.
    function summaryLines(ctx, description, maxWidth) {
      const words = description.match(/[ \t]*(?:'[^']+'|[^\s']+)|\n/g) || [];
      const lines = [];
      let line = [];
      const measure = tokens => {
        let width = 0;
        tokens.forEach(token => {
          ctx.font = "500 26px 'Noto Sans KR', sans-serif";
          width += ctx.measureText(token.space).width;
          const bold = token.bold;
          ctx.font = `${bold ? 800 : 500} 26px 'Noto Sans KR', sans-serif`;
          width += ctx.measureText(token.text).width;
        });
        return width;
      };
      for (const word of words) {
        if (word === "\n") { if (line.length) lines.push(line); line = []; continue; }
        const space = word.match(/^[ \t]*/)[0];
        const raw = word.slice(space.length);
        const bold = raw.startsWith("'") && raw.endsWith("'");
        const token = {space: line.length ? space : "", text: bold ? raw.slice(1, -1) : raw, bold};
        if (line.length && space && measure([...line, token]) > maxWidth) {
          lines.push(line);
          line = [];
          token.space = "";
        }
        line.push(token);
      }
      if (line.length) lines.push(line);
      return { lines, measure };
    }

    async function saveFinalResultImage() {
      const completed = history.filter(Boolean);
      if (completed.length !== stages.length || completed.some(item => !item.imageUrl)) {
        alert("모든 단계의 결과가 완성된 후 저장할 수 있습니다.");
        return;
      }
      await document.fonts.ready;
      const cols = 5, rows = 2;
      const panelWidth = 820, panelHeight = 610;
      const gap = 24, padding = 32;
      const canvas = document.createElement("canvas");
      canvas.width = padding * 2 + cols * panelWidth + (cols - 1) * gap;
      canvas.height = padding * 2 + rows * panelHeight + (rows - 1) * gap;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const loadImage = url => new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });

      try {
        for (let i = 0; i < completed.length; i++) {
          const item = completed[i];
          const x = padding + (i % cols) * (panelWidth + gap);
          const y = padding + Math.floor(i / cols) * (panelHeight + gap);
          ctx.fillStyle = "#f8faf9";
          ctx.fillRect(x, y, panelWidth, panelHeight);
          ctx.strokeStyle = "#dbe3df";
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 1, y + 1, panelWidth - 2, panelHeight - 2);

          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#253d68";
          ctx.font = "800 34px 'Noto Sans KR', sans-serif";
          ctx.fillText(`${item.number}. ${item.title}`, x + panelWidth / 2, y + 40);

          const img = await loadImage(item.imageUrl);
          const imageX = x + 20, imageY = y + 74;
          const imageW = panelWidth - 40, imageH = 385;
          const scale = Math.min(imageW / img.naturalWidth, imageH / img.naturalHeight);
          const drawW = img.naturalWidth * scale, drawH = img.naturalHeight * scale;
          ctx.drawImage(img, imageX + (imageW - drawW) / 2, imageY + (imageH - drawH) / 2, drawW, drawH);

          const {lines, measure} = summaryLines(ctx, finalSummaries[i], panelWidth - 72);
          const lineHeight = 38;
          const firstY = y + 490 + (3 - lines.length) * lineHeight / 2;
          lines.forEach((tokens, lineIndex) => {
            let cursor = x + (panelWidth - measure(tokens)) / 2;
            tokens.forEach(token => {
              ctx.font = "500 26px 'Noto Sans KR', sans-serif";
              cursor += ctx.measureText(token.space).width;
              ctx.font = `${token.bold ? 800 : 500} 26px 'Noto Sans KR', sans-serif`;
              ctx.fillStyle = "#283d33";
              ctx.textAlign = "left";
              ctx.fillText(token.text, cursor, firstY + lineIndex * lineHeight);
              cursor += ctx.measureText(token.text).width;
            });
          });
        }

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("이미지 생성에 실패했습니다.");

        const fileName = `감수분열_완성결과_2n=4_${new Date().toISOString().slice(0,10)}.png`;

        if (window.showSaveFilePicker) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: "PNG 이미지", accept: { "image/png": [".png"] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return;
          } catch (error) {
            if (error && error.name === "AbortError") return;
          }
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        console.error(error);
        alert("완성 결과 이미지를 저장하는 중 문제가 발생했습니다.");
      }
    }

    $("saveFinalResult").addEventListener("click", saveFinalResultImage);

    $("restart").addEventListener("click",() => {
      stage=0; placements=[]; meta1Placements=[]; meta2Placements=[]; bankFlipState={pair:false,smallPair:false}; history=[]; resetSpindles();
      $("final").classList.add("hidden"); renderHistory(); render();
    });

    $("modalClose").addEventListener("click",closeHistory);
    $("modalBackdrop").addEventListener("click",closeHistory);
    document.addEventListener("keydown",event => { if (event.key==="Escape") closeHistory(); });

    lucide.createIcons();
    renderHistory();
    render();
  </script>
 </body>
</html>
